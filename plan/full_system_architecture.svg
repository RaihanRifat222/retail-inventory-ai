  <text class="ts" x="587" y="430" text-anchor="middle" dominant-baseline="central">Stock redistribution</text>
</g>

<!-- arrows from AI engine to row 2 modules (routing via shared midline at y=230) -->
<path d="M280 195 L280 230 L102 230 L102 388" fill="none" class="arr" marker-end="url(#arrow)" stroke="#993C1D" stroke-dasharray="4 3"/>
<path d="M320 195 L320 230 L267 230 L267 388" fill="none" class="arr" marker-end="url(#arrow)" stroke="#993C1D" stroke-dasharray="4 3"/>
<path d="M360 195 L360 230 L432 230 L432 388" fill="none" class="arr" marker-end="url(#arrow)" stroke="#993C1D" stroke-dasharray="4 3"/>
<path d="M400 195 L400 230 L587 230 L587 388" fill="none" class="arr" marker-end="url(#arrow)" stroke="#993C1D" stroke-dasharray="4 3"/>

